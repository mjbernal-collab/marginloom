<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let choice='system';
        try { const saved=localStorage.getItem('marginloom-appearance'); if(['light','dark','system'].includes(saved)) choice=saved; } catch {}
        const dark=choice==='dark'||(choice==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme=dark?'dark':'light';
        document.documentElement.dataset.appearance=choice;
        document.documentElement.style.colorScheme=dark?'dark':'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#194d3d" />
    <meta name="description" content="A private study space. Turn your notes into answers and practice with AI on your device." />
    <title>Marginloom — Your offline study space</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Marginloom" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
